<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puyo Puyo Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Puyo Puyo Game</h1>
    </header>
    <main>
      <section class="board" role="grid" aria-label="Game Board">
        <!-- Puyos will be generated by js-puyo.js -->
      </section>
      <div class="score" aria-live="polite">Score: 0</div>
      <div class="game-controls">
        <button onclick="startGame()">Start Game</button>
        <button onclick="restartGame()">Restart Game</button>
      </div>
    </main>
    <footer>
      <p>Game developed by SomeOne</p>
    </footer>
    <script src="./js-puyo.js"></script>
  </body>
</html>
